[package]
name = "nekoya-stt"
version = "0.1.0"
edition = "2021"
description = "Speech-to-text daemon: Qwen realtime ASR feeding clipboard / VRChat OSC / OpenCode, with a WayVR subtitle panel"
license = "MIT"
repository = "https://github.com/EMeowAGENT/nekoya-stt-daemon"
default-run = "nekoya-stt"

[[bin]]
name = "nekoya-stt"
path = "src/main.rs"

[lib]
name = "nekoya_stt"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.release]
lto = true
strip = true
